# PyPI에는 비밀 값 없이 trusted publishing으로 올린다 — PyPI의 cysuml 프로젝트에 이 레포·이 파일 이름·환경 pypi를 등록해 둔다.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 태그가 main에 들어간 커밋에 달렸는지 보기
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main에 없다 — main의 squash 커밋에 태그를 단다"
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: 태그가 pyproject.toml 버전과 같은지 보기
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 가 pyproject.toml 버전 $version 과 다르다 — 태그는 v$version 이어야 한다"
            exit 1
          fi
      - run: uv build
      - name: 빌드한 휠을 설치한 환경에서 테스트
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest
      - name: 지원하는 가장 낮은 파이썬 3.10과 pyproject.toml 의존성 하한에서 테스트
        run: uv run --isolated --python 3.10 --resolution lowest-direct --no-editable pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cysuml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
