# PyPI에는 비밀 값 없이 trusted publishing으로 올린다 — PyPI의 cysuml 프로젝트에 이 레포·이 파일 이름·환경 pypi를 등록해 둔다.
# MCP 레지스트리에는 GitHub OIDC로 로그인해 올린다 — 따로 등록해 둘 것은 없다.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 태그가 main에 들어간 커밋에 달렸는지 보기
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main에 없다 — main의 squash 커밋에 태그를 단다"
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: 태그가 pyproject.toml 버전과 같은지 보기
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 가 pyproject.toml 버전 $version 과 다르다 — 태그는 v$version 이어야 한다"
            exit 1
          fi
      - run: uv build
      - name: 빌드한 휠을 설치한 환경에서 테스트
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest
      - name: 지원하는 가장 낮은 파이썬 3.10과 pyproject.toml 의존성 하한에서 테스트
        run: uv run --isolated --python 3.10 --resolution lowest-direct --no-editable pytest
      - name: server.json이 MCP 레지스트리 형식에 맞는지 보기
        # PyPI에 올린 버전은 되돌릴 수 없고 레지스트리 job은 그 뒤에 돈다 — 형식 오류는 PyPI에 올리기 전에 막는다.
        # 검사 주소(바뀌지 않게 고정된 v0.1 API)는 맞으면 200과 valid true를 준다. 틀리면 내용 검사는 200과 valid false로,
        # 본문 형식(길이 초과는 422, 깨진 JSON은 400 등)은 그 상태 코드와 JSON 오류 목록으로 알린다
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/validate.json"
          code="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 30 -o "$out" -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" --data-binary @server.json \
            https://registry.modelcontextprotocol.io/v0.1/validate)" || code=000
          cat "$out" 2>/dev/null && echo
          if [ "$code" = 200 ] && jq -e '.valid == true' "$out" >/dev/null 2>&1; then
            exit 0
          fi
          case "$code" in
            200) jq -e '.valid == false' "$out" >/dev/null 2>&1 && rejected=yes || rejected=no ;;
            400|422) jq -e 'type == "object"' "$out" >/dev/null 2>&1 && rejected=yes || rejected=no ;;
            *) rejected=no ;;
          esac
          if [ "$rejected" = yes ]; then
            echo "::error::server.json이 MCP 레지스트리 검사를 통과하지 못했다 — 고친 커밋을 머지한 뒤 그 커밋에 태그를 옮겨 단다"
          else
            echo "::error::MCP 레지스트리 검사 주소에서 알아볼 수 있는 검사 결과를 받지 못했다(HTTP $code) — 잠시 뒤 이 job을 다시 돌린다"
          fi
          exit 1
      # 레지스트리 job이 쓸 mcp-publisher도 PyPI에 올리기 전에 받아 확인해 둔다 — 받기·서명 확인이 늘 실패하면 올린 버전을 레지스트리에 못 싣는다.
      # 위에서 검사한 server.json을 함께 넘겨, 레지스트리에 올리는 파일이 곧 검사한 파일이 되게 한다
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: mcp-publisher를 받아 서명 확인
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"  # 이 job이 아니라 레지스트리 job(ubuntu-latest, amd64)이 돌린다
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          mkdir -p "$RUNNER_TEMP/registry"
          cp server.json "$RUNNER_TEMP/registry/"
          cd "$RUNNER_TEMP/registry"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: ${{ runner.temp }}/registry/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cysuml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # 레지스트리는 올리는 버전의 PyPI README에서 mcp-name 줄을 찾으므로 PyPI에 올린 뒤에 돈다
  registry:
    needs: publish
    runs-on: ubuntu-latest
    # 다시 시도 다섯 번이 다 멈추면(한 번에 로그인·올리기 1분씩, 조회 30초, 기다림 30초) 15분쯤 걸리므로 넉넉히 둔다
    timeout-minutes: 25
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: ${{ runner.temp }}/registry
      - name: MCP 레지스트리에 OIDC로 로그인해 올리기(PyPI에 막 올린 판이 늦게 보이면 다시 시도)
        run: |
          set -uo pipefail
          publisher="$RUNNER_TEMP/registry/mcp-publisher"
          server_json="$RUNNER_TEMP/registry/server.json"
          chmod +x "$publisher"  # 아티팩트는 실행 권한을 싣지 않는다
          name="$(jq -er .name "$server_json")" || exit 1
          version="$(jq -er .version "$server_json")" || exit 1
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$version"
          for try in 1 2 3 4 5; do
            # 로그인 토큰은 5분이면 끝나므로 시도마다 새로 받는다. 요청 하나가 멈춰 job 시간을 다 쓰지 않게 1분에 끊는다
            if timeout 60 "$publisher" login github-oidc; then
              if timeout 60 "$publisher" publish "$server_json"; then
                exit 0
              fi
              # 앞선 시도가 들어갔는데 응답만 못 받았으면 다시 올릴 때 "이미 있는 버전" 오류가 난다.
              # 로그인한 시도에서만 본다 — 로그인이 망가졌는데 이미 있는 버전 때문에 성공으로 끝나면 그 고장이 가려진다
              if curl --fail --silent --max-time 30 --output /dev/null "$url"; then
                echo "::warning::레지스트리에 $name $version 이 이미 있어 성공으로 끝낸다 — 이번 시도가 올린 것인지는 모르니 레지스트리의 그 버전 내용을 확인한다"
                exit 0
              fi
            fi
            if [ "$try" -lt 5 ]; then
              sleep 30
            fi
          done
          echo "::error::MCP 레지스트리에 $name $version 을 올리지 못했다 — PyPI에는 이미 올라갔다. 일시적인 실패면 이 job만 다시 돌리고, 위 오류가 server.json·README 문제면 다시 돌려도 같으니 고쳐서 다음 버전으로 낸다"
          exit 1
