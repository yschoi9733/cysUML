# PyPI에는 비밀 값 없이 trusted publishing으로 올린다 — PyPI의 cysuml 프로젝트에 이 레포·이 파일 이름·환경 pypi를 등록해 둔다.
# MCP 레지스트리에는 GitHub OIDC로 로그인해 올린다 — 따로 등록해 둘 것은 없다.
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 태그가 main에 들어간 커밋에 달렸는지 보기
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main에 없다 — main의 squash 커밋에 태그를 단다"
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: 태그가 pyproject.toml 버전과 같은지 보기
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 가 pyproject.toml 버전 $version 과 다르다 — 태그는 v$version 이어야 한다"
            exit 1
          fi
      - name: server.json이 MCP 레지스트리 형식에 맞는지 보기
        # PyPI에 올린 버전은 되돌릴 수 없고 레지스트리 job은 그 뒤에 돈다 — 형식 오류는 PyPI에 올리기 전에 막는다
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/validate.json"
          code="$(curl --silent --show-error --retry 3 --max-time 30 -o "$out" -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" --data-binary @server.json \
            https://registry.modelcontextprotocol.io/v0/validate)" || code=000
          cat "$out" 2>/dev/null && echo
          if [ "$code" = 200 ] && jq -e '.valid == true' "$out" >/dev/null; then
            exit 0
          fi
          if [ "$code" = 200 ] || [ "$code" = 422 ]; then
            echo "::error::server.json이 MCP 레지스트리 검사를 통과하지 못했다 — 고친 커밋을 머지한 뒤 그 커밋에 태그를 옮겨 단다"
          else
            echo "::error::MCP 레지스트리 검사 주소에서 답을 받지 못했다(HTTP $code) — 잠시 뒤 이 job을 다시 돌린다"
          fi
          exit 1
      - run: uv build
      - name: 빌드한 휠을 설치한 환경에서 테스트
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest
      - name: 지원하는 가장 낮은 파이썬 3.10과 pyproject.toml 의존성 하한에서 테스트
        run: uv run --isolated --python 3.10 --resolution lowest-direct --no-editable pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cysuml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # 레지스트리는 올리는 버전의 PyPI README에서 mcp-name 줄을 찾으므로 PyPI에 올린 뒤에 돈다
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: mcp-publisher를 받아 서명 확인
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: MCP 레지스트리에 OIDC로 로그인해 올리기(PyPI에 막 올린 판이 늦게 보이면 다시 시도)
        run: |
          set -uo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$version"
          for try in 1 2 3 4 5; do
            # 로그인 토큰은 5분이면 끝나므로 시도마다 새로 받는다
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
              exit 0
            fi
            # 앞선 시도가 들어갔는데 응답만 못 받았으면 다시 올릴 때 "이미 있는 버전" 오류가 난다
            if curl --fail --silent --output /dev/null "$url"; then
              echo "레지스트리에 $name $version 이 이미 있다"
              exit 0
            fi
            if [ "$try" -lt 5 ]; then
              sleep 30
            fi
          done
          echo "::error::MCP 레지스트리에 $name $version 을 올리지 못했다 — PyPI에는 이미 올라갔다. 일시적인 실패면 이 job만 다시 돌리고, 위 오류가 server.json·README 문제면 다시 돌려도 같으니 고쳐서 다음 버전으로 낸다"
          exit 1
