[project]
name = "cysuml"
version = "0.1.0"
description = "MCP server that draws document-ready UML diagrams: the AI lays them out, cysUML draws and checks them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/cysuml/fonts/*-LICENSE.txt"]
dependencies = [
    "fonttools>=4.38",
    "mcp>=2.3.0",
    "pillow>=10.1.0",
]

[project.urls]
Repository = "https://github.com/yschoi9733/cysUML"
Issues = "https://github.com/yschoi9733/cysUML/issues"

[project.scripts]
cysuml = "cysuml.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
